# Fake services for the end-to-end tests. Nothing here talks to Google, Ollama or Whisper.
# Start with: npm run e2e:services
services:
  postgres:
    image: docker.io/library/postgres:14-alpine
    environment:
      POSTGRES_DB: voiceassistant
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d voiceassistant"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Plays Google's OpenID Connect provider. Its login page lets the test choose user and claims.
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "8090:8080"

  # Plays Whisper, Ollama, Google Tasks and Google Calendar (see wiremock/mappings).
  wiremock:
    image: docker.io/wiremock/wiremock:3.9.1
    # Java's HttpClient (used for Ollama) asks to upgrade to HTTP/2; real Ollama ignores that, WireMock must too.
    command: ["--global-response-templating", "--disable-banner", "--disable-http2-plain"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8089:8080"
